[tool.pytest.ini_options]
testpaths = ["tests"]           # plain `pytest` runs the examples; exercises run on purpose
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
exclude = ["^examples/", "^exercises/"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "exercises"]   # deliberately broken code; check those files by name

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]
ignore = ["E501"]                     # let the formatter handle long lines

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.ruff.format]
quote-style = "double"
